name: Deploy to Staging

on:
  push:
    branches:
      - staging

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: symplichain_test
          POSTGRES_USER: ${{ secrets.DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install coverage

      - name: Run Django tests
        env:
          DJANGO_SETTINGS_MODULE: symplichain.settings.test
          DATABASE_URL: postgres://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@localhost:5432/symplichain_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
        run: |
          python manage.py migrate --settings=symplichain.settings.test
          coverage run manage.py test --settings=symplichain.settings.test
          coverage report --fail-under=70

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend (staging)
        working-directory: frontend
        env:
          REACT_APP_API_URL: ${{ secrets.STAGING_API_URL }}
          REACT_APP_ENV: staging
        run: npm run build

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build/
          retention-days: 1

  deploy-backend:
    name: Deploy Backend to Staging EC2
    runs-on: ubuntu-latest
    needs: [test]
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Create deployment package
        run: |
          zip -r deploy.zip . \
            --exclude "*.git*" \
            --exclude "frontend/*" \
            --exclude "*.pyc" \
            --exclude "__pycache__/*" \
            --exclude ".env*"

      - name: Upload deploy package to S3
        run: |
          aws s3 cp deploy.zip s3://${{ secrets.STAGING_DEPLOY_BUCKET }}/backend/deploy-${{ github.sha }}.zip

      - name: Deploy to Staging EC2 via SSM
        run: |
          aws ssm send-command \
            --instance-ids "${{ secrets.STAGING_EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy staging ${{ github.sha }}" \
            --parameters 'commands=[
              "set -e",
              "cd /var/www/symplichain",
              "aws s3 cp s3://${{ secrets.STAGING_DEPLOY_BUCKET }}/backend/deploy-${{ github.sha }}.zip /tmp/deploy.zip",
              "unzip -o /tmp/deploy.zip -d /tmp/deploy_staging",
              "rsync -av --delete /tmp/deploy_staging/ /var/www/symplichain/ --exclude='.env' --exclude='staticfiles/'",
              "source /var/www/symplichain/venv/bin/activate",
              "pip install -r requirements.txt --quiet",
              "python manage.py migrate --settings=symplichain.settings.staging --noinput",
              "python manage.py collectstatic --settings=symplichain.settings.staging --noinput",
              "sudo systemctl restart gunicorn-staging",
              "sudo systemctl restart celery-staging",
              "sudo systemctl reload nginx",
              "rm -rf /tmp/deploy.zip /tmp/deploy_staging"
            ]' \
            --output text \
            --query 'Command.CommandId' > /tmp/ssm_command_id.txt

      - name: Wait for SSM command to complete
        run: |
          COMMAND_ID=$(cat /tmp/ssm_command_id.txt)
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.STAGING_EC2_INSTANCE_ID }}"

      - name: Check deploy result
        run: |
          COMMAND_ID=$(cat /tmp/ssm_command_id.txt)
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.STAGING_EC2_INSTANCE_ID }}" \
            --query 'Status' --output text)
          if [ "$STATUS" != "Success" ]; then
            echo "Deployment failed with status: $STATUS"
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.STAGING_EC2_INSTANCE_ID }}" \
              --query 'StandardErrorContent' --output text
            exit 1
          fi

  deploy-frontend:
    name: Deploy Frontend to S3 (Staging)
    runs-on: ubuntu-latest
    needs: [build-frontend, test]
    environment: staging

    steps:
      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend/build/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Sync frontend to S3
        run: |
          aws s3 sync frontend/build/ s3://${{ secrets.STAGING_S3_BUCKET }}/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html"
          # index.html should not be cached (short TTL so deploys propagate fast)
          aws s3 cp frontend/build/index.html s3://${{ secrets.STAGING_S3_BUCKET }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.STAGING_CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

  notify:
    name: Notify on Slack
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]
    if: always()
    steps:
      - name: Notify deployment status
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "${{ needs.deploy-backend.result == 'success' && needs.deploy-frontend.result == 'success' && '✅' || '❌' }} *Staging Deploy* - ${{ github.actor }} pushed `${{ github.sha }}` — ${{ needs.deploy-backend.result }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

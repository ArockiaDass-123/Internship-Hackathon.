name: Deploy to Production

on:
  push:
    branches:
      - main

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: symplichain_test
          POSTGRES_USER: ${{ secrets.DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install coverage

      - name: Run Django tests
        env:
          DJANGO_SETTINGS_MODULE: symplichain.settings.test
          DATABASE_URL: postgres://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@localhost:5432/symplichain_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
        run: |
          python manage.py migrate --settings=symplichain.settings.test
          coverage run manage.py test --settings=symplichain.settings.test
          coverage report --fail-under=70

  build-frontend:
    name: Build Frontend (Production)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend (production)
        working-directory: frontend
        env:
          REACT_APP_API_URL: ${{ secrets.PROD_API_URL }}
          REACT_APP_ENV: production
          NODE_ENV: production
        run: npm run build

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-prod
          path: frontend/build/
          retention-days: 1

  # Production requires manual approval before deploying
  request-approval:
    name: Request Deployment Approval
    runs-on: ubuntu-latest
    needs: [test, build-frontend]
    environment: production  # GitHub environment with required reviewers configured
    steps:
      - name: Approval gate
        run: echo "Deployment to production approved. Proceeding..."

  deploy-backend:
    name: Deploy Backend to Production EC2
    runs-on: ubuntu-latest
    needs: [request-approval]
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Create deployment package
        run: |
          zip -r deploy.zip . \
            --exclude "*.git*" \
            --exclude "frontend/*" \
            --exclude "*.pyc" \
            --exclude "__pycache__/*" \
            --exclude ".env*"

      - name: Upload deploy package to S3
        run: |
          aws s3 cp deploy.zip s3://${{ secrets.PROD_DEPLOY_BUCKET }}/backend/deploy-${{ github.sha }}.zip

      - name: Deploy to Production EC2 via SSM (Blue-Green)
        run: |
          # We run DB migrations before restarting gunicorn to avoid downtime
          aws ssm send-command \
            --instance-ids "${{ secrets.PROD_EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy production ${{ github.sha }}" \
            --parameters 'commands=[
              "set -e",
              "cd /var/www/symplichain",
              "# Backup current release",
              "cp -r /var/www/symplichain /tmp/symplichain_backup_$(date +%Y%m%d%H%M%S) || true",
              "aws s3 cp s3://${{ secrets.PROD_DEPLOY_BUCKET }}/backend/deploy-${{ github.sha }}.zip /tmp/deploy.zip",
              "unzip -o /tmp/deploy.zip -d /tmp/deploy_prod",
              "rsync -av --delete /tmp/deploy_prod/ /var/www/symplichain/ --exclude='.env' --exclude='staticfiles/'",
              "source /var/www/symplichain/venv/bin/activate",
              "pip install -r requirements.txt --quiet",
              "# Run migrations first — must be backward-compatible",
              "python manage.py migrate --settings=symplichain.settings.production --noinput",
              "python manage.py collectstatic --settings=symplichain.settings.production --noinput",
              "# Graceful gunicorn reload (no dropped connections)",
              "sudo kill -HUP $(cat /var/run/gunicorn-prod.pid)",
              "sudo systemctl restart celery-prod",
              "sudo systemctl reload nginx",
              "rm -rf /tmp/deploy.zip /tmp/deploy_prod"
            ]' \
            --output text \
            --query 'Command.CommandId' > /tmp/ssm_command_id.txt

      - name: Wait for SSM command
        run: |
          COMMAND_ID=$(cat /tmp/ssm_command_id.txt)
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.PROD_EC2_INSTANCE_ID }}"

      - name: Verify deployment health
        run: |
          COMMAND_ID=$(cat /tmp/ssm_command_id.txt)
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.PROD_EC2_INSTANCE_ID }}" \
            --query 'Status' --output text)
          if [ "$STATUS" != "Success" ]; then
            echo "Deployment FAILED: $STATUS — manual rollback required"
            exit 1
          fi
          # Basic health check
          HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}" ${{ secrets.PROD_API_URL }}/api/health/)
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Health check failed: HTTP $HTTP_STATUS"
            exit 1
          fi

  deploy-frontend:
    name: Deploy Frontend to S3 (Production)
    runs-on: ubuntu-latest
    needs: [request-approval]
    environment: production

    steps:
      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build-prod
          path: frontend/build/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Sync to S3 (Production)
        run: |
          aws s3 sync frontend/build/ s3://${{ secrets.PROD_S3_BUCKET }}/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html"
          aws s3 cp frontend/build/index.html s3://${{ secrets.PROD_S3_BUCKET }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront (Production)
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.PROD_CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

  tag-release:
    name: Tag Release
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create release tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag "release-$(date +%Y%m%d-%H%M%S)-${{ github.sha::7 }}"
          git push origin --tags

  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]
    if: always()
    steps:
      - name: Slack Notification
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "${{ needs.deploy-backend.result == 'success' && needs.deploy-frontend.result == 'success' && '🚀 ✅' || '🚨 ❌' }} *Production Deploy* — `${{ github.sha }}` by ${{ github.actor }} — Backend: ${{ needs.deploy-backend.result }} | Frontend: ${{ needs.deploy-frontend.result }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
